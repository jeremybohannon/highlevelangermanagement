<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>High Level Anger Management Inc</title>
    <meta
      name="description"
      content="High Level Anger Management Inc — Full service Anger Agency"
    />
    <style>
      :root {
        --olive: #8a8c1c;
        --ink: #1a1a1a;
        --paper: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Proxima Nova", "Segoe UI", Helvetica, Arial, sans-serif;
      }

      a {
        color: inherit;
      }

      #canvas {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header {
        text-align: center;
        padding-top: 56px;
      }

      .logo img {
        max-width: 350px;
        width: 100%;
        height: auto;
      }

      .site-info {
        margin-top: 18px;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #555;
      }

      .site-info div {
        margin: 2px 0;
      }

      .site-tag-line {
        margin-top: 10px;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #999;
      }

      .page-divider {
        border-bottom: 3px solid var(--olive);
        margin: 40px 0;
      }

      main {
        padding-bottom: 40px;
      }

      .video-wrapper {
        display: flex;
        justify-content: center;
      }

      video {
        display: block;
        width: 100%;
        height: auto;
      }

      .legal-note {
        max-width: 700px;
        margin: 28px auto 0;
        text-align: center;
        font-size: 13px;
        font-style: italic;
        color: #666;
        line-height: 1.5;
      }

      footer {
        border-top: 1px solid #e2e2e2;
        padding: 28px 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 14px;
        color: #555;
      }

      footer a.email {
        text-decoration: none;
        color: #555;
      }

      footer a.email:hover {
        text-decoration: underline;
      }

      .social-links {
        display: flex;
        gap: 12px;
      }

      .social-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
      }

      .social-links svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      @media (max-width: 640px) {
        header {
          padding-top: 32px;
        }
        .page-divider {
          margin: 28px 0;
        }
        footer {
          flex-direction: column;
          text-align: center;
        }
      }
    </style>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="canvas">
      <header>
        <h1 class="logo">
          <a href="/"
            ><img src="hlam.png" alt="High Level Anger Management Inc"
          /></a>
        </h1>

        <div class="site-info">
          <div>High Level Anger Management Inc.</div>
          <div>704-867-5309</div>
        </div>
      </header>

      <div class="page-divider"></div>

      <main>
        <div class="video-wrapper">
          <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/s34ZwMKgBGQ?si=Ikn0AbPNEti6ZVXS"
            title="YouTube video player"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>

        <p class="legal-note">
          *This is not affiliated with
          <a class="email" href="https://www.highlevelsportsmanagement.com"
            >High Level Sports Management Inc.</a
          >
        </p>
      </main>
    </div>
  </body>
</html>
